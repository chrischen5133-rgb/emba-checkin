<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>课堂签到</title>

<style>

body{
    margin:0;
    background:#f7f7f7;
    font-family:"Microsoft YaHei",sans-serif;
}

.container{
    width:90%;
    max-width:420px;
    margin:80px auto;
    background:white;
    padding:35px;
    border-radius:20px;
    text-align:center;
}

h1{
    color:#8b1e2d;
}

input{
    width:90%;
    padding:15px;
    margin:25px 0;
    font-size:16px;
    border:1px solid #ddd;
    border-radius:10px;
}

button{
    width:90%;
    padding:15px;
    background:#9b2335;
    color:white;
    border:none;
    border-radius:10px;
    font-size:18px;
}

</style>

</head>


<body>

<div class="container">

<h1>课堂签到</h1>

<p>北京大学国家发展研究院 EMBA</p>

<p>请输入您的姓名</p>


<input 
id="name"
placeholder="请输入姓名">


<br>


<button onclick="submitCheckin()">
立即签到
</button>


</div>



<script>

function submitCheckin(){

let name=document.getElementById("name").value;


if(name==""){
alert("请输入姓名");
return;
}


let now = new Date();

let time = now.toLocaleString("zh-CN");

alert(
"签到成功！\n\n"+
"姓名："+name+
"\n课程：战略管理"+
"\n日期：2026年9月3日"+
"\n时间："+time+
"\n方式：H5签到"
);


}

</script>


</body>

</html>
